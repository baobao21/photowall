services:
  - type: web
    name: photowall
    runtime: node
    plan: starter          # free tier sleeps; use an external cron to hit /api/tick if you go free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: photos
      - key: IP_SALT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VPNCHECK_API_KEY   # optional (proxycheck.io); leave empty to disable VPN blocking
        sync: false
      - key: TRUST_PROXY_HOPS   # proxies in front of the app; verify with /api/admin/whoami
        value: "2"
      - key: REQUIRE_APPROVAL   # "true" (default) = new uploads wait for admin approval
        value: "true"
      - key: SUPABASE_ANON_KEY  # optional but recommended: used only to verify passwords at login
        sync: false
      - key: SITE_URL           # your public URL, used in password-reset emails
        value: "https://photowall-faoe.onrender.com"
      - key: SESSION_SECRET     # optional: random string that signs login sessions
        sync: false
