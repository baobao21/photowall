services:
  - type: web
    name: photowall
    runtime: node
    plan: starter          # free tier sleeps; use an external cron to hit /api/tick if you go free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: photos
      - key: IP_SALT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VPNCHECK_API_KEY   # optional (proxycheck.io); leave empty to disable VPN blocking
        sync: false
      - key: REQUIRE_APPROVAL   # "true" = new uploads wait for admin approval
        value: "false"
