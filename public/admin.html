<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE WALL — Admin Moderation</title>
<style>
  body { background: #0d0d12; color: #eaeaf0; font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
  input, button { padding: 10px; margin: 5px 0; background: #16161e; color: #fff; border: 1px solid #262633; border-radius: 8px; }
  button { background: #ef476f; cursor: pointer; font-weight: bold; }
  .photo-card { background: #16161e; border: 1px solid #262633; padding: 15px; margin-bottom: 15px; border-radius: 10px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
  .photo-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; background: #000; }
  .details { flex: 1; min-width: 180px; word-break: break-word; }
  .status-live { color: #6ee7a0; font-weight: bold; }
  .status-rejected { color: #ef476f; font-weight: bold; }
  .status-pending { color: #ffd166; font-weight: bold; }
  .status-archived { color: #8a8a9a; font-weight: bold; }
  .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
  .gray { background: #333; font-size: 13px; padding: 8px 14px; }
</style>
</head>
<body>
  <h1>Admin Moderation Panel</h1>
  <div id="loginSection">
    <input type="password" id="passInput" placeholder="Enter Admin Password">
    <button id="loginBtn">Login</button>
  </div>

  <div id="dashboard" style="display:none;">
    <div class="dashboard-header">
      <h2>Photo Queue &amp; Moderation</h2>
      <div>
        <button class="gray" id="skipBtn">Skip current photo</button>
        <button class="gray" id="refreshBtn">Refresh</button>
        <button class="gray" id="logoutBtn">Logout</button>
      </div>
    </div>
    <div id="photoList">Loading photos…</div>
    <h2 style="margin-top:30px">Users</h2>
    <p style="color:#8a8a9a;font-size:13px">Each account is locked to one connection (IP). "Reset IP lock" lets a user re-bind to their new connection on their next upload.</p>
    <div id="userList">Loading users…</div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('adminToken') || '';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const PLACEHOLDER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='50%' fill='%23aaa' dominant-baseline='middle' text-anchor='middle'>No Image</text></svg>";

function showDashboard(on) {
  $('loginSection').style.display = on ? 'none' : 'block';
  $('dashboard').style.display = on ? 'block' : 'none';
}

async function api(url, opts = {}) {
  const res = await fetch(url, { ...opts, headers: { 'x-admin-token': token, ...(opts.headers || {}) } });
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  return res;
}

async function login() {
  const password = $('passInput').value;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      token = data.token;
      localStorage.setItem('adminToken', token);
      showDashboard(true);
      loadPhotos();
      loadUsers();
    } else {
      alert(data.error || 'Login failed.');
    }
  } catch (e) { alert('Network error.'); }
}

function logout() {
  localStorage.removeItem('adminToken');
  token = '';
  showDashboard(false);
  $('passInput').value = '';
}

async function loadPhotos() {
  const list = $('photoList');
  try {
    const res = await api('/api/admin/photos');
    const photos = await res.json();
    if (!Array.isArray(photos) || !photos.length) {
      list.innerHTML = '<p>No photos found in the database.</p>';
      return;
    }
    list.innerHTML = photos.map((p) => `
      <div class="photo-card" data-id="${esc(p.id)}">
        <img src="${esc(p.url)}" alt="Photo">
        <div class="details">
          <p><b>Status:</b> <span class="status-${esc(p.status)}">${esc(p.status)}</span></p>
          <p><b>Caption:</b> ${p.caption ? esc(p.caption) : '<i>No caption</i>'}</p>
          <p><b>Uploader:</b> ${esc(p.op_name || 'Anonymous')}</p>
          <p><small>Uploaded: ${esc(new Date(p.created_at).toLocaleString())}</small></p>
        </div>
        <div>
          <button data-act="live" style="background:#6ee7a0; color:#000;">Approve (Live)</button><br>
          <button data-act="rejected">Reject</button><br>
          <button data-act="delete" style="background:#333; margin-top:5px;">Delete</button>
        </div>
      </div>`).join('');
    list.querySelectorAll('img').forEach((img) => { img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; }; });
  } catch (e) {
    if (e.message !== 'unauthorized') list.innerHTML = '<p>Error loading photos.</p>';
  }
}

async function loadUsers() {
  const list = $('userList');
  try {
    const res = await api('/api/admin/profiles');
    const users = await res.json();
    if (!Array.isArray(users) || !users.length) { list.innerHTML = '<p>No registered users yet.</p>'; return; }
    list.innerHTML = users.map((u) => `
      <div class="photo-card" data-uid="${esc(u.user_id)}">
        <div class="details">
          <p><b>${esc(u.username)}</b> — ${u.locked ? '🔒 IP locked' : '🔓 unlocked (binds on next upload)'}</p>
          <p><small>Joined: ${esc(new Date(u.created_at).toLocaleString())}</small></p>
        </div>
        <div>
          <button data-uact="reset" class="gray">Reset IP lock</button>
          <button data-uact="ban">Delete account</button>
        </div>
      </div>`).join('');
  } catch (e) {
    if (e.message !== 'unauthorized') list.innerHTML = '<p>Error loading users.</p>';
  }
}

$('userList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-uact]');
  if (!btn) return;
  const uid = btn.closest('.photo-card').dataset.uid;
  try {
    if (btn.dataset.uact === 'reset') {
      const res = await api('/api/admin/profiles/' + encodeURIComponent(uid) + '/reset-ip', { method: 'POST' });
      res.ok ? loadUsers() : alert('Failed to reset.');
    } else {
      if (!confirm('Delete this account permanently? Their photos stay but are detached from it.')) return;
      const res = await api('/api/admin/profiles/' + encodeURIComponent(uid), { method: 'DELETE' });
      res.ok ? loadUsers() : alert('Failed to delete user.');
    }
  } catch (err) {}
});

async function setStatus(photoId, status) {
  const res = await api('/api/admin/moderate-photo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ photoId, status })
  });
  res.ok ? loadPhotos() : alert('Failed to update photo status.');
}

async function deletePhoto(photoId) {
  if (!confirm('Are you sure you want to completely delete this photo?')) return;
  const res = await api('/api/admin/photos/' + encodeURIComponent(photoId), { method: 'DELETE' });
  res.ok ? loadPhotos() : alert('Failed to delete photo.');
}

async function skip() {
  const res = await api('/api/admin/skip', { method: 'POST' });
  if (!res.ok) alert('Failed to skip.');
}

// event delegation (no inline onclick with interpolated ids)
$('photoList').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.closest('.photo-card').dataset.id;
  if (btn.dataset.act === 'delete') deletePhoto(id);
  else setStatus(id, btn.dataset.act);
});
$('loginBtn').onclick = login;
$('passInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('logoutBtn').onclick = logout;
$('refreshBtn').onclick = () => { loadPhotos(); loadUsers(); };
$('skipBtn').onclick = skip;

if (token) { showDashboard(true); loadPhotos(); loadUsers(); }
</script>
</body>
</html>
