<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE WALL — Admin Moderation</title>
<style>
  body { background: #0d0d12; color: #eaeaf0; font-family: sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
  input, button { padding: 10px; margin: 5px 0; background: #16161e; color: #fff; border: 1px solid #262633; border-radius: 8px; }
  button { background: #ef476f; cursor: pointer; font-weight: bold; }
  .photo-card { background: #16161e; border: 1px solid #262633; padding: 15px; margin-bottom: 15px; border-radius: 10px; display: flex; gap: 15px; align-items: center; }
  .photo-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 6px; background: #000; }
  .details { flex: 1; }
  .status-live { color: #6ee7a0; font-weight: bold; }
  .status-rejected { color: #ef476f; font-weight: bold; }
  .status-pending { color: #ffd166; font-weight: bold; }
</style>
</head>
<body>
  <h1>Admin Moderation Panel</h1>
  <div id="loginSection">
    <input type="password" id="passInput" placeholder="Enter Admin Password">
    <button onclick="login()">Login</button>
  </div>
  
  <div id="dashboard" style="display:none;">
    <h2>Photo Queue & Moderation</h2>
    <div id="photoList">Loading photos…</div>
  </div>

<script>
let token = localStorage.getItem('adminToken') || '';

if (token) {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadPhotos();
}

async function login() {
  const password = document.getElementById('passInput').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (res.ok) {
    token = data.token;
    localStorage.setItem('adminToken', token);
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadPhotos();
  } else {
    alert(data.error);
  }
}

async function loadPhotos() {
  try {
    const res = await fetch('/api/admin/photos', {
      headers: { 'x-admin-token': token }
    });
    const photos = await res.json();
    const list = document.getElementById('photoList');
    
    if (!photos.length) {
      list.innerHTML = '<p>No photos found in the database.</p>';
      return;
    }

    list.innerHTML = photos.map(p => {
      // Using your actual Supabase project reference: xktxwljgckpnvkcsjirl
      const imgUrl = `https://xktxwljgckpnvkcsjirl.supabase.co/storage/v1/object/public/photos/${p.storage_path}`;
      return `
        <div class="photo-card">
          <img src="${imgUrl}" alt="Photo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23333\'/><text x=\'50%\' y=\'50%\' fill=\'%23aaa\' dominant-baseline=\'middle\' text-anchor=\'middle\'>No Image</text></svg>'">
          <div class="details">
            <p><b>Status:</b> <span class="status-${p.status}">${p.status}</span></p>
            <p><b>Caption:</b> ${p.caption || '<i>No caption</i>'}</p>
            <p><b>Uploader:</b> ${p.op_name || 'Anonymous'}</p>
            <p><small>Uploaded: ${new Date(p.created_at).toLocaleString()}</small></p>
          </div>
          <div>
            <button onclick="setStatus('${p.id}', 'live')" style="background:#6ee7a0; color:#000;">Approve (Live)</button><br>
            <button onclick="setStatus('${p.id}', 'rejected')">Reject</button><br>
            <button onclick="deletePhoto('${p.id}')" style="background:#333; margin-top:5px;">Delete</button>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('photoList').innerHTML = '<p>Error loading photos.</p>';
  }
}

async function setStatus(photoId, status) {
  const res = await fetch('/api/admin/moderate-photo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
    body: JSON.stringify({ photoId, status })
  });
  if (res.ok) {
    loadPhotos();
  } else {
    alert('Failed to update photo status.');
  }
}

async function deletePhoto(photoId) {
  if (!confirm('Are you sure you want to completely delete this photo?')) return;
  const res = await fetch('/api/admin/photos/' + photoId, {
    method: 'DELETE',
    headers: { 'x-admin-token': token }
  });
  if (res.ok) {
    loadPhotos();
  } else {
    alert('Failed to delete photo.');
  }
}
</script>
</body>
</html>
