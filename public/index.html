<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Photowall</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Main Container -->
  <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col my-auto">
    
    <!-- Photo Display Area -->
    <div class="relative w-full bg-black flex items-center justify-center" style="min-height: 300px; max-height: 450px;">
      <img id="photoImg" src="" alt="Photowall Image" class="w-full h-full object-contain">
      <div id="timerBadge" class="absolute top-3 right-3 bg-black/70 backdrop-blur text-xs px-2.5 py-1 rounded-full border border-gray-700">
        ⏱️ <span id="timeLeft">15</span>s
      </div>
    </div>

    <!-- Photo Info & Engagement Bar -->
    <div class="p-4 border-b border-gray-800">
      <div class="flex justify-between items-center mb-2">
        <span id="opName" class="font-bold text-sm text-blue-400">Loading...</span>
        <div class="flex items-center gap-3">
          <button onclick="likePhoto()" class="flex items-center gap-1 text-sm bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-full transition">
            ❤️ <span id="likeCount">0</span>
          </button>
          <span class="text-xs text-gray-400">💬 <span id="commentCount">0</span></span>
        </div>
      </div>
      <p id="caption" class="text-sm text-gray-300 break-words"></p>
    </div>

    <!-- Comments & Threaded Replies Section -->
    <div class="p-4 flex-1 flex flex-col max-h-60 overflow-y-auto space-y-3" id="commentsContainer">
      <p class="text-xs text-gray-500 text-center">Loading comments...</p>
    </div>

    <!-- Comment Input Box -->
    <div class="p-3 bg-gray-950 border-t border-gray-800 flex gap-2">
      <input type="text" id="commentInput" placeholder="Write a comment..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
      <button onclick="postComment()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition">Send</button>
    </div>

  </div>

  <!-- Footer Upload Trigger -->
  <div class="w-full max-w-md mt-4 text-center">
    <a href="/upload.html" class="inline-block w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-sm font-medium border border-gray-700 transition">
      📸 Upload Your Photo
    </a>
  </div>

</body>
</html>
